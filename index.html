<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Digital Clock</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Manrope:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#08090b;
    --bg-1:#0e1013;
    --ink:#eae6df;
    --ink-dim:#5c6068;
    --amber:#c9a24d;
    --amber-dim:#7a6733;
  }

  html, body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:var(--bg-0);
    overflow:hidden;
  }

  .stage{
    width:100vw;
    height:100vh;
    aspect-ratio:1/1;
    max-width:100vmin;
    max-height:100vmin;
    margin:0 auto;
    position:relative;
    background:
      radial-gradient(circle at 50% 42%, var(--bg-1) 0%, var(--bg-0) 68%);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }

  /* faint vignette + grain for depth */
  .vignette{
    position:absolute; inset:0;
    box-shadow: inset 0 0 18vmin 2vmin rgba(0,0,0,0.65);
    pointer-events:none;
  }

  .grain{
    position:absolute; inset:0;
    opacity:0.05;
    pointer-events:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    mix-blend-mode: overlay;
  }

  /* thin radial tick ring, minute marks -- a quiet clock-face echo */
  .ticks{
    position:absolute;
    width:78vmin; height:78vmin;
    border-radius:50%;
    pointer-events:none;
  }
  .tick{
    position:absolute;
    left:50%; top:50%;
    width:1px;
    height:1.6vmin;
    background:var(--ink-dim);
    opacity:0.35;
    transform-origin:50% 39vmin;
  }
  .tick.major{
    height:2.6vmin;
    width:1.5px;
    background:var(--amber-dim);
    opacity:0.55;
  }

  .digital{
    font-family:'Space Mono', monospace;
    font-variant-numeric: tabular-nums;
    letter-spacing:0.02em;
  }

  .time-row{
    display:flex;
    align-items:baseline;
    justify-content:center;
    line-height:1;
  }

  .hms{
    font-size:14vmin;
    font-weight:700;
    color:var(--ink);
    text-shadow: 0 0 3.2vmin rgba(201,162,77,0.16), 0 0 0.4vmin rgba(234,230,223,0.25);
    letter-spacing:0.03em;
  }

  .sec{
    font-size:6vmin;
    font-weight:700;
    color:var(--amber);
    margin-left:1.4vmin;
    align-self:flex-end;
    padding-bottom:1.6vmin;
    opacity:0.9;
    text-shadow: 0 0 2.4vmin rgba(201,162,77,0.35);
  }

  .colon{
    display:inline-block;
    transition:opacity 0.15s ease;
  }
  .colon.dim{ opacity:0.22; }

  .meta-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:1.6vmin;
    margin-top:2.6vmin;
  }

  .date-label{
    font-family:'Manrope', sans-serif;
    font-weight:400;
    font-size:2.1vmin;
    letter-spacing:0.42em;
    text-transform:uppercase;
    color:var(--ink-dim);
  }

  .divider{
    width:0.55vmin; height:0.55vmin;
    border-radius:50%;
    background:var(--amber-dim);
  }

  .ampm{
    font-family:'Manrope', sans-serif;
    font-weight:500;
    font-size:2.3vmin;
    letter-spacing:0.28em;
    color:var(--amber);
    margin-left:2vmin;
    align-self:center;
  }

  .frame-label{
    position:absolute;
    top:5.4vmin;
    left:0; right:0;
    text-align:center;
    font-family:'Manrope', sans-serif;
    font-size:1.5vmin;
    letter-spacing:0.5em;
    text-transform:uppercase;
    color:var(--ink-dim);
    opacity:0.55;
  }

  .hint{
    position:absolute;
    bottom:2.6vmin;
    left:0; right:0;
    text-align:center;
    font-family:'Manrope', sans-serif;
    font-size:1.3vmin;
    letter-spacing:0.15em;
    color:var(--ink-dim);
    opacity:0;
    transition:opacity 0.4s ease;
  }
  .stage:hover .hint{ opacity:0.4; }

  @media (prefers-reduced-motion: reduce){
    .colon{ transition:none; }
  }
</style>
</head>
<body>

<div class="stage" id="stage">
  <div class="vignette"></div>
  <div class="grain"></div>

  <div class="ticks" id="ticks"></div>

  <div class="frame-label">Local Time</div>

  <div class="center">
    <div class="time-row">
      <span class="hms digital" id="time">00:00</span><span class="sec digital" id="seconds">00</span>
      <span class="ampm" id="ampm">AM</span>
    </div>
    <div class="meta-row">
      <span class="date-label" id="date">—</span>
    </div>
  </div>

  <div class="hint">double‑click for fullscreen</div>
</div>

<script>
  // build a quiet tick ring: 60 marks, majors every 5
  const ticksEl = document.getElementById('ticks');
  for (let i = 0; i < 60; i++){
    const t = document.createElement('div');
    t.className = 'tick' + (i % 5 === 0 ? ' major' : '');
    t.style.transform = `translate(-50%,-50%) rotate(${i * 6}deg)`;
    ticksEl.appendChild(t);
  }

  const timeEl = document.getElementById('time');
  const secEl = document.getElementById('seconds');
  const ampmEl = document.getElementById('ampm');
  const dateEl = document.getElementById('date');

  const pad = n => String(n).padStart(2, '0');

  function render(){
    const now = new Date();
    let h = now.getHours();
    const m = now.getMinutes();
    const s = now.getSeconds();
    const ampm = h >= 12 ? 'PM' : 'AM';
    h = h % 12; if (h === 0) h = 12;

    const colonOpacity = s % 2 === 0 ? '' : ' dim';
    timeEl.innerHTML = `${pad(h)}<span class="colon${colonOpacity}">:</span>${pad(m)}`;
    secEl.textContent = pad(s);
    ampmEl.textContent = ampm;

    dateEl.textContent = now.toLocaleDateString(undefined, {
      weekday: 'long', month: 'long', day: 'numeric', year: 'numeric'
    });
  }

  render();
  setInterval(render, 1000);

  // double-click to toggle fullscreen, handy on a dedicated monitor
  document.getElementById('stage').addEventListener('dblclick', () => {
    if (!document.fullscreenElement){
      document.documentElement.requestFullscreen().catch(()=>{});
    } else {
      document.exitFullscreen();
    }
  });
</script>

</body>
</html>
